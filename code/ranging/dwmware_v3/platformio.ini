; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
; lib_deps = https://github.com/espressif/arduino-esp32.git
; upload_speed = 921600

[env:wemostag01]
board = wemos_d1_uno32
build_flags = -std=gnu++23 -fmodules-ts --define-macro=TAGCODE -DTAG_ID=1 -DBOARD=2
upload_port = /dev/ttyUSB0

[env:wemostag02]
board = wemos_d1_uno32
build_flags = -std=gnu++23 -fmodules-ts --define-macro=TAGCODE -DTAG_ID=2 -DBOARD=2
upload_port = /dev/ttyUSB1

; [env:wroomtag01]
; board = upesy_wroom
; build_flags = -std=gnu++23 -fmodules-ts --define-macro=TAGCODE -DTAG_ID=1 -DBOARD=1
; upload_port = /dev/ttyUSB2



[env:wroomanchor01]
board = upesy_wroom
build_flags = --define-macro=ANCHORCODE -DANCHOR_ID=1 -DBOARD=1
upload_port = /dev/ttyUSB0
lib_deps = knolleary/PubSubClient@^2.8

[env:wroomanchor02]
board = upesy_wroom
build_flags = --define-macro=ANCHORCODE -DANCHOR_ID=2 -DBOARD=1 -DINFOSTRING="\"NOTSET\""
upload_port = /dev/ttyUSB2
lib_ignore=UWB-DW3000-NRF52
lib_deps = knolleary/PubSubClient@^2.8

[env:wroomanchor03]
board = upesy_wroom
build_flags = --define-macro=ANCHORCODE -DANCHOR_ID=3 -DBOARD=1
upload_port = /dev/ttyUSB3
lib_deps = knolleary/PubSubClient@^2.8

[env:nrftag]
platform = nordicnrf52
board = adafruit_feather_nrf52832
build_flags = --define-macro=TAGCODE -DBOARD=3
monitor_dtr = 0
monitor_rts = 0

[env:nrftag1]
platform = nordicnrf52
board = adafruit_feather_nrf52832
build_flags = --define-macro=TAGCODE -DTAG_ID=1 -DBOARD=3 -DINFOSTRING="\"FEATHER1\"" -DXTALTRIM=40
monitor_dtr = 0
monitor_rts = 0

[env:nrftag1dwm3001c]
; Qorvo DWM3001CDK: nRF52833 with on-module DW3110 (boards/dwm3001cdk.json)
; first bring-up once: pio run -e nrftag1dwm3001c -t flash_softdevice (installs
; MBR + SoftDevice S140 7.3.0 and erases the factory Qorvo firmware)
; serial I/O is UART0 on the J-Link OB virtual COM port at 115200
; (src/boards.hpp remaps Serial -> Serial1 = UART0 for BOARD=4).
platform = nordicnrf52
board = dwm3001cdk
upload_protocol = jlink
build_flags =
    --define-macro=TAGCODE -DTAG_ID=1 -DBOARD=4 -DINFOSTRING="\"DWM3001C1\""
monitor_dtr = 0
monitor_rts = 0
monitor_port = /dev/ttyACM0
; Run after PlatformIO's stock J-Link builder so this script can replace its
; raw-binary uploader with Intel-HEX-aware J-Link `loadfile` commands.
extra_scripts = post:uploader/dwm3001cdk_flash.py

[env:nrftag2]
platform = nordicnrf52
board = adafruit_feather_nrf52832
build_flags = --define-macro=TAGCODE -DTAG_ID=2 -DBOARD=3 -DINFOSTRING="\"FEATHER2\"" -DXTALTRIM=40
monitor_dtr = 0
monitor_rts = 0

[env:wemosanchor]
board = wemos_d1_uno32
build_flags = --define-macro=ANCHORCODE -DBOARD=2
upload_port = /dev/ttyUSB0

[env:upesyanchor]
board = upesy_wroom
build_flags = --define-macro=ANCHORCODE -DBOARD=1
upload_port = /dev/ttyUSB0

[env:wemosanchor01]
board = wemos_d1_uno32
build_flags = --define-macro=ANCHORCODE -DANCHOR_ID=1 -DBOARD=2 -DINFOSTRING="\"wemosanchor01\""
upload_port = /dev/ttyUSB0
lib_deps = knolleary/PubSubClient@^2.8

[env:wemosanchor02]
board = wemos_d1_uno32
build_flags = --define-macro=ANCHORCODE -DANCHOR_ID=2 -DBOARD=2 -DINFOSTRING="\"wemosanchor02\""
upload_port = /dev/ttyUSB1
lib_deps = knolleary/PubSubClient@^2.8

[env:serialrelay]
board = upesy_wroom
build_flags = --define-macro=ESPNOWTOSERIALCODE -DBOARD=1 -DINFOSTRING="\"serialrelay1\""
lib_ignore=UWB-DW3000-NRF52
