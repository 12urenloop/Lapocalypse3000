[env:nrftag2dwm3001c]
; Qorvo DWM3001CDK: nRF52833 with on-module DW3110 (boards/dwm3001cdk.json)
; first bring-up once: pio run -e nrftag1dwm3001c -t flash_softdevice (installs
; MBR + SoftDevice S140 7.3.0 and erases the factory Qorvo firmware)
; serial I/O is UART0 on the J-Link OB virtual COM port at 115200
; (src/boards.hpp remaps Serial -> Serial1 = UART0 for BOARD=4).
platform = nordicnrf52@11.0.0
platform_packages = toolchain-gccarmnoneeabi@1.140201.0
board = dwm3001cdk
upload_protocol = jlink
build_flags =
    -DMODULE_FIRMWARE
    -DTAG_ID=2 -DBOARD=4 -DINFOSTRING="\"DWM3001C1\""
    -Ofast
    -funroll-loops
    -finline-functions
    -fomit-frame-pointer
    -mtune=cortex-m4
    --param inline-unit-growth=1000
    --param max-inline-insns-auto=1000
    -falign-functions=16
    -falign-loops=16
    -falign-jumps=16
    -fgcse-after-reload
    -fipa-cp-clone
build_src_filter = +<main_tag.cpp> -<main_anchor.cpp> -<main_legacy.cpp> -<a_serial_commands.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_gateway.cpp> -<a_firmware_*.cpp>
custom_module_units = serial_commands:src/a_serial_commands.cpp
custom_module_firmware = src/a_firmware_tag.cpp
custom_module_entry = main_tag.cpp
monitor_dtr = 0
monitor_rts = 0
monitor_port = /dev/ttyACM0
; Run after PlatformIO's stock J-Link builder so this script can replace its
; raw-binary uploader with Intel-HEX-aware J-Link `loadfile` commands.
extra_scripts =
    pre:uploader/build_application_module.py
    post:uploader/dwm3001cdk_flash.py

[env:nrftag3001c]
extends = env:nrftag1dwm3001c

