[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_egui = "^0.39.1"
ffmpeg-next = "8.1.0"
metrics = "^0.24.3"
rumqttc = "^0.25.1"
lapin = "^2.5.0"
tokio = { version = "^1.48.0", features = ["rt", "rt-multi-thread", "time", "net"] }
futures-util = "^0.3.31"
serde = "^1.0.228"
serde_json = "^1.0.145"

[dependencies.bevy_metrics_dashboard]
version = "0.8.0"
default-features = false
features = ["bevy_egui"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
