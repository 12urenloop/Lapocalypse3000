services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: uwb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uwb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-uwb}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
