build_src_filter = +<*> -<main_anchor.cpp> -<main_legacy.cpp> -<a_serial_commands.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_gateway.cpp> -<a_firmware_*.cpp>
custom_module_units = serial_commands:src/a_serial_commands.cpp
custom_module_firmware = src/a_firmware_tag.cpp
custom_module_entry = main_tag.cpp
extra_scripts = pre:uploader/build_application_module.py
