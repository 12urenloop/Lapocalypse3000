input {
  rabbitmq {
    host => "${RABBITMQ_HOST:localhost}"
    port => "${RABBITMQ_PORT:5672}"
    user => "${RABBITMQ_USER:uwb}"
    password => "${RABBITMQ_PASS:uwb}"
    vhost => "/"
    queue => "${RABBITMQ_QUEUE:uwb.logstash.persist}"
    durable => true
    auto_delete => false
    ack => true
    prefetch_count => 256
    codec => "json"
    exchange => "${RABBITMQ_EXCHANGE:uwb.data}"
    exchange_type => "topic"
    key => "${RABBITMQ_BINDING_KEY:node.*}"
  }
}

filter {
  ruby {
    code => "event.set('logstashPersistedAtMs', (Time.now.to_f * 1000).to_i)"
  }
}

output {
  file {
    path => "${OUTPUT_FILE:/usr/share/logstash/data/uwb-logstash.jsonl}"
    codec => json_lines
  }
}
