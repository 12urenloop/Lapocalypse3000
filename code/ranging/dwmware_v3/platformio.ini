; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
build_src_filter = +<*> -<main_legacy.cpp> -<a_serial_commands.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_gateway.cpp> -<a_firmware_*.cpp>
; Application code uses C++23. Nordic targets override PlatformIO's legacy
; ARM GCC package below because the bundled GCC 7.2 cannot compile C++23.
; lib_deps = https://github.com/espressif/arduino-esp32.git
; upload_speed = 921600

[env:wemostag01]
board = wemos_d1_uno32
build_flags = -DMODULE_FIRMWARE -DTAG_ID=1 -DBOARD=2
build_src_filter = +<main_tag.cpp> -<main_anchor.cpp> -<main_legacy.cpp> -<a_serial_commands.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_gateway.cpp> -<a_firmware_*.cpp>
custom_module_units = serial_commands:src/a_serial_commands.cpp
custom_module_firmware = src/a_firmware_tag.cpp
custom_module_entry = main_tag.cpp
extra_scripts = pre:uploader/build_application_module.py
upload_port = /dev/ttyUSB0

[env:wemostag02]
board = wemos_d1_uno32
build_flags = -DMODULE_FIRMWARE -DTAG_ID=2 -DBOARD=2
build_src_filter = +<main_tag.cpp> -<main_anchor.cpp> -<main_legacy.cpp> -<a_serial_commands.cpp> -<a_sstwr_initiator_uwbsync.cpp> -<a_espnow_reporter.cpp> -<a_gateway.cpp> -<a_firmware_*.cpp>
custom_module_units = serial_commands:src/a_serial_commands.cpp
custom_module_firmware = src/a_firmware_tag.cpp
custom_module_entry = main_tag.cpp
extra_scripts = pre:uploader/build_application_module.py
upload_port = /dev/ttyUSB1

